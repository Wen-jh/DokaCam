name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# GITHUB_TOKEN 需要写权限才能创建 Release
permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # AI 模型体积大，漏提交时 fail-fast 而不是静默出一个没有 AI 的包
      - name: Sanity check AI models
        run: |
          test -s app/src/main/assets/face_landmarker.task || { echo "::error::face_landmarker.task missing"; exit 1; }
          test -s app/src/main/assets/efficientdet_lite0.tflite || { echo "::error::efficientdet_lite0.tflite missing"; exit 1; }
          ls -lh app/src/main/assets/

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: List APKs
        run: |
          echo "=== APK 产物 ==="
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AICam-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AICam-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # push 到 main 时自动创建 Release（打 tag），APK 直接可下载安装
      - name: Create Release with APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: AICam v1.0.${{ github.run_number }}
          body: |
            自动构建 · ${{ github.sha }}

            **AICam —— AI 拍摄教练 · Varlens 风格全屏取景相机**

            - 超大取景区（>95%），控件可折叠 / 无操作自动淡出
            - AI 拍摄教练：MediaPipe 端侧人脸/物体检测 → 构图评分、方向引导
              （相机左移/右移/抬高/压低）、焦距建议（含 35mm 等效焦距）、用光提示
            - 主体金框实时跟踪，构图到位快门亮金圈，小白也能出片
            - 点触对焦 + 白环动画、捏合 / 0.6–5x 胶囊平滑变焦
            - 定时快门、构图线、闪光/手电、前置镜像
            - OpenGL 预览管线：帧驱动渲染 + TransformationInfo 转正

            | 文件 | 说明 |
            |---|---|
            | app-debug.apk | 调试版（.debug 后缀包名，可与正式版共存） |
            | app-release-unsigned.apk | 发布版（未签名，安装前需自签或用 debug 版） |

            > 安装 debug 版即可直接体验全部功能。
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
