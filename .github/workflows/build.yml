name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: List APKs
        run: |
          echo "=== APK 产物 ==="
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DokaCam-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DokaCam-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # push 到 main 时自动创建 Release（打 tag），APK 直接可下载安装
      - name: Create Release with APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          name: DokaCam v1.0.${{ github.run_number }}
          body: |
            自动构建 · ${{ github.sha }}

            **DokaCam —— Doka 风格开源相机**

            - 26 款胶片/CCD/黑白/创意滤镜（实时预览，所见即所得）
            - AI 构图引导 + AI 滤镜推荐 + 人像美颜（全端侧离线）
            - CCD 低清模式、复古日期水印、多焦段、六种网格

            | 文件 | 说明 |
            |---|---|
            | app-debug.apk | 调试版（.debug 后缀包名，可与正式版共存） |
            | app-release-unsigned.apk | 发布版（未签名，安装前需自签或用 debug 版） |

            > 安装 debug 版即可直接体验全部功能。
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
